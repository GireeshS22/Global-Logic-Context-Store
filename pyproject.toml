[tool.poetry]
name = "glcs"
version = "0.1.0"
description = "Global Logical Context Store - Neuro-symbolic middleware for LLM consistency"
authors = ["PhD Project"]
readme = "README.md"
packages = [{include = "glcs"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0"
pydantic = "^2.12.4"
python-dotenv = "^1.2.1"
pyyaml = "^6.0.3"
sentence-transformers = "^5.1.2"
chromadb = "^0.5.20"
ollama = "^0.6.1"
fastapi = "^0.121.2"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
python-multipart = "^0.0.20"
# Optional provider SDK extras (#31)
openai = {version = "^1.0.0", optional = true}
anthropic = {version = "^0.40.0", optional = true}
groq = "^1.2.0"
google-generativeai = {version = "^0.8.0", optional = true}

[tool.poetry.extras]
openai = ["openai"]
anthropic = ["anthropic"]
groq = ["groq"]
gemini = ["google-generativeai"]
all-providers = ["openai", "anthropic", "groq", "google-generativeai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
ruff = "^0.3.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"
pytest-sugar = "^1.1.1"
openai = "^1.0.0"
anthropic = "^0.40.0"
groq = "^1.2.0"
google-generativeai = "^0.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
