[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glcs"
version = "0.2.0"
description = "Global Logical Context Store - Multi-provider logical contradiction detection for LLM conversations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GLCS Team"}
]
maintainers = [
    {name = "GLCS Team"}
]
keywords = [
    "llm",
    "logical-reasoning",
    "contradiction-detection",
    "openai",
    "claude",
    "gemini",
    "ollama",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

# Core dependencies (no LLM provider packages)
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Individual provider dependencies
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.7.0"]
gemini = ["google-generativeai>=0.3.0"]
groq = ["groq>=0.4.0"]
ollama = ["ollama>=0.1.0"]

# Provider bundles
cloud-providers = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
]

all-providers = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Web UI dependencies
ui = [
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
]

# All dependencies (for complete installation)
all = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/GireeshS22/Global-Logic-Context-Store"
Documentation = "https://github.com/GireeshS22/Global-Logic-Context-Store/tree/main/docs"
Repository = "https://github.com/GireeshS22/Global-Logic-Context-Store"
Issues = "https://github.com/GireeshS22/Global-Logic-Context-Store/issues"

[tool.setuptools]
packages = ["glcs", "glcs.providers"]

[tool.setuptools.package-data]
glcs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=glcs",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: Integration tests",
    "unit: Unit tests",
    "slow: Slow tests",
    "requires_api_key: Tests that require API keys",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
