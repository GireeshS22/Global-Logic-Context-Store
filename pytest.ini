[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    integration: Integration tests
    unit: Unit tests
    slow: Slow tests
    requires_api_key: Tests that require API keys

filterwarnings =
    ignore:.*Accessing the 'model_fields' attribute.*
    ignore::ResourceWarning
    ignore::FutureWarning
    ignore:.*min_items.*
    ignore:.*Support for class-based.*