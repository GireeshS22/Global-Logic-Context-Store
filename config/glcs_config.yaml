# GLCS Configuration File
# Version: 0.1.0 (MVP)
# This file contains all configurable parameters for the Global Logical Context Store

# Memory Configuration
memory:
  # Vector dimension (must match encoder output)
  # 768 for all-mpnet-base-v2, 384 for all-MiniLM-L6-v2
  vector_dimension: 768

  # Similarity threshold for retrieving related statements
  # Range: 0.0-1.0, higher = more similar required
  similarity_threshold: 0.85

  # Initial capacity hint for memory (can grow dynamically)
  initial_capacity: 1000

# Consistency Checking Configuration
consistency:
  # Threshold for direct contradiction detection
  # Statements with similarity >= this are checked for contradiction
  direct_contradiction_threshold: 0.85

  # Minimum confidence to report a violation
  # Range: 0.0-1.0, lower = more sensitive
  confidence_threshold: 0.5

# Semantic Encoder Configuration
encoder:
  # Sentence-transformer model name
  # Options: all-mpnet-base-v2 (768-dim), all-MiniLM-L6-v2 (384-dim)
  model_name: "all-mpnet-base-v2"

  # Batch size for encoding multiple statements
  batch_size: 32

  # Cache embeddings to avoid recomputation
  cache_embeddings: true

# Logical Parser Configuration (Stage 1.5)
parser:
  # LLM provider for parsing
  # Options: ollama (local/free), openai, anthropic, gemini, groq
  # Recommended: ollama for development, openai for production
  llm_provider: "ollama"

  # Model to use for parsing
  # Ollama: qwen2.5:0.5b (tiny, fast), llama3.2, llama3.1, mistral
  # OpenAI: gpt-4o-mini (cheap), gpt-4o (accurate)
  # Anthropic: claude-3-haiku (fast), claude-3-5-sonnet (accurate)
  # Gemini: gemini-1.5-flash (cheap), gemini-1.5-pro (accurate)
  # Groq: llama-3.1-70b-versatile (very fast)
  model: "qwen2.5:0.5b"

  # Maximum retries on API failure
  max_retries: 3

  # Request timeout in seconds
  timeout: 30

  # Enable caching of parsed results (saves API costs)
  cache_enabled: true

  # Low temperature for consistent parsing
  temperature: 0.1

  # Maximum tokens for parser response
  max_tokens: 300

# Logging Configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Log format: simple (human-readable), json (structured)
  format: "simple"

  # Log file path (relative to project root)
  log_file: "glcs.log"

# Optional: Future Features (not yet implemented)
# inference:
#   enable_transitive_reasoning: false
#   max_inference_depth: 3
#   enable_causal_analysis: false
